name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create venv and install deps
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
      - name: Run tests
#        env:
#          PYTHONPATH: ./src
#        run: .venv/bin/pytest -q --cov=src --cov-report=xml
